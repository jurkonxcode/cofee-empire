<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<title>Coffee Empire</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1410;
    color: #f5e6d3;
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #game-container {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  #game-container canvas { display: block; }
  .boot-error {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #1a1410; color: #f5e6d3;
    z-index: 9999; padding: 24px; text-align: center;
  }
  .boot-error button {
    margin-top: 16px; padding: 10px 20px;
    background: #f5e6d3; color: #1a1410;
    border: 0; border-radius: 8px; font-size: 14px;
    font-weight: 600; font-family: inherit;
  }
  #ce-time-display {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: #8b6f47;
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.5px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="game-container"></div>

<div id="ce-time-display">M2.1 · Day 1 · 08:00</div>

<div id="boot-error" class="boot-error" style="display:none">
  <div>
    <strong>Gagal memuat game.</strong>
    <p id="boot-error-msg" style="margin-top:12px;color:#a68457;font-size:13px">
      Periksa koneksi internet lalu muat ulang.
    </p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</div>

<script>
  var ASSET_VERSION = '0.3.3';

  window.showBootError = function (msg) {
    var el = document.getElementById('boot-error');
    var msgEl = document.getElementById('boot-error-msg');
    if (el) el.style.display = 'flex';
    if (msgEl) msgEl.textContent = msg;
  };

  window.CoffeeEmpire = window.CoffeeEmpire || {};
</script>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"
        onerror="window.showBootError('Gagal memuat Phaser dari CDN.');"></script>

<script>
  (function () {
    var v = '?v=' + ASSET_VERSION;
    var files = [
      './src/core/EventBus.js' + v,
      './src/core/GameState.js' + v,
      './src/systems/TimeSystem.js' + v,
      './src/world/IsoUtils.js' + v,
      './src/world/Tilemap.js' + v,
      './src/world/CafeLayout.js' + v,
      './src/world/CameraController.js' + v,
      './src/main.js' + v
    ];
    function loadNext(i) {
      if (i >= files.length) return;
      var s = document.createElement('script');
      s.src = files[i];
      s.onload = function () { loadNext(i + 1); };
      s.onerror = function () {
        window.showBootError('Gagal memuat: ' + files[i]);
      };
      document.body.appendChild(s);
    }
    loadNext(0);
  })();
</script>

</body>
</html>
