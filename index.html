<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tes Coffee Empire</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1410;
    color:#f5e6d3;font-family:system-ui,sans-serif}
  #msg{position:fixed;inset:0;display:flex;align-items:center;
    justify-content:center;text-align:center;padding:24px;z-index:9}
  #msg h1{font-size:22px;margin-bottom:8px}
  #msg p{font-size:14px;color:#a68457}
</style>
</head>
<body>

<div id="msg">
  <div>
    <h1>Tes 1: HTML + CSS</h1>
    <p>Jika kamu melihat teks ini, GitHub Pages dan HTML dasar berfungsi.</p>
  </div>
</div>

<!-- Tes 2: fetch main.js -->
<script>
fetch('./src/main.js', { cache: 'no-store' })
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(function (txt) {
    document.querySelector('#msg h1').textContent = 'Tes 2: main.js berhasil diambil';
    document.querySelector('#msg p').textContent =
      'Panjang file: ' + txt.length + ' karakter. import map & Phaser akan diuji berikutnya.';
  })
  .catch(function (err) {
    document.querySelector('#msg h1').textContent = 'Tes 2 GAGAL: main.js tidak dapat diambil';
    document.querySelector('#msg p').textContent =
      'Error: ' + err.message + '. Kemungkinan cache atau path salah.';
  });
</script>

</body>
</html>
