<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<title>Coffee Empire</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1410;
    color: #f5e6d3;
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #game-container {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  #game-container canvas { display: block; }
  .boot-error {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #1a1410; color: #f5e6d3;
    z-index: 9999; padding: 24px; text-align: center;
  }
  .boot-error button {
    margin-top: 16px; padding: 10px 20px;
    background: #f5e6d3; color: #1a1410;
    border: 0; border-radius: 8px; font-size: 14px;
    font-weight: 600; font-family: inherit;
  }
</style>
</head>
<body>

<div id="game-container"></div>

<div id="boot-error" class="boot-error" style="display:none">
  <div>
    <strong>Gagal memuat game.</strong>
    <p id="boot-error-msg" style="margin-top:12px;color:#a68457;font-size:13px">
      Periksa koneksi internet lalu muat ulang.
    </p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</div>

<!-- Phaser UMD klasik: mengekspos window.Phaser tanpa import map -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"
        onerror="document.getElementById('boot-error').style.display='flex';
                 document.getElementById('boot-error-msg').textContent='Gagal memuat Phaser dari CDN.';"></script>

<!-- main.js: self-contained, tidak ada import -->
<script src="./src/main.js"
        onerror="document.getElementById('boot-error').style.display='flex';
                 document.getElementById('boot-error-msg').textContent='Gagal memuat main.js.';"></script>

</body>
</html>
